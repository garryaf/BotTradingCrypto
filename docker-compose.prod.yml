services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autotrade_db}
      POSTGRES_USER: ${POSTGRES_USER:-autotrade_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autotrade_app} -d ${POSTGRES_DB:-autotrade_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.agents:/app/.agents:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  postgres_prod_data:
