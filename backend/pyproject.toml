[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrade-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "httpx>=0.27",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "cryptography>=43.0",
]

[tool.setuptools]
packages = ["src"]
